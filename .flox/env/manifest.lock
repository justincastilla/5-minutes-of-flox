{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "install": {
      "postgresql_16": {
        "pkg-path": "postgresql_16"
      },
      "python313": {
        "pkg-path": "python313"
      },
      "redis": {
        "pkg-path": "redis"
      },
      "uv": {
        "pkg-path": "uv"
      }
    },
    "vars": {
      "PGDATABASE": "agent",
      "PGHOST": "/tmp/fivemin-postgres",
      "PGPORT": "5432",
      "PGUSER": "postgres",
      "REDIS_HOST": "127.0.0.1",
      "REDIS_PORT": "6380"
    },
    "hook": {
      "on-activate": "  export PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  export REDIS_URL=\"redis://$REDIS_HOST:$REDIS_PORT/0\"\n  export UV_CACHE_DIR=\"$FLOX_ENV_CACHE/uv\"\n  mkdir -p \"$PGHOST\"\n\n  if [ ! -d \"$PGDATA\" ]; then\n    initdb -D \"$PGDATA\" --username=\"$PGUSER\" --auth=trust --no-locale --encoding=UTF8 >/dev/null\n    pg_ctl -D \"$PGDATA\" -o \"-p $PGPORT -k $PGHOST -c listen_addresses=''\" -l \"$PGDATA/init.log\" -w start >/dev/null\n    createdb \"$PGDATABASE\"\n    psql -q -f \"$FLOX_ENV_PROJECT/seed.sql\"\n    pg_ctl -D \"$PGDATA\" -m fast -w stop >/dev/null\n  fi\n\n  cd \"$FLOX_ENV_PROJECT\"\n  uv sync --quiet\n  source .venv/bin/activate\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-linux",
        "aarch64-linux"
      ]
    },
    "services": {
      "auto-start": true,
      "postgres": {
        "command": "exec postgres -D \"$PGDATA\" -p \"$PGPORT\" -k \"$PGHOST\" -c listen_addresses=\"\""
      },
      "redis": {
        "command": "  mkdir -p \"$FLOX_ENV_CACHE/redis\"\n  exec redis-server --bind \"$REDIS_HOST\" --port \"$REDIS_PORT\" --dir \"$FLOX_ENV_CACHE/redis\"\n"
      }
    }
  },
